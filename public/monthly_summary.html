<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สรุปยอดการเข้าเรียนรายเดือน</title>
  <!-- โหลดฟอนต์ Sarabun สำหรับงานเอกสารราชการ -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <!-- โหลดไลบรารีแปลง PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f4f4f9; padding: 20px; }
    .control-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    button { background: #2c3e50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1a252f; }
    
    /* สไตล์สำหรับหน้ากระดาษ A4 ที่จะแปลงเป็น PDF */
    #pdf-content {
      background: white;
      padding: 40px; /* ขอบกระดาษ */
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      box-sizing: border-box;
      display: none; /* ซ่อนไว้ก่อน จะแสดงตอนกดสร้าง PDF */
    }
    h2, h3 { text-align: center; margin: 5px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #000; padding: 8px; text-align: center; }
    .signature-box { margin-top: 50px; text-align: right; padding-right: 30px; }
  </style>
</head>
<body>

  <!-- 🎛️ แผงควบคุม (Control Panel) -->
  <div class="control-panel">
    <h3>⚙️ ตั้งค่าเอกสารสรุปรายเดือน</h3>
    
    <div class="form-group">
      <label><b>📅 เลือกเดือน:</b></label>
      <select id="selectMonth">
        <option value="08">สิงหาคม</option>
        <option value="09">กันยายน</option>
        <option value="10">ตุลาคม</option>
      </select>
    </div>

    <div class="form-group">
      <label><b>🎯 เลือกสถานะที่ต้องการแสดง:</b></label><br>
      <input type="checkbox" id="chk-absent" value="absent" checked> <label>ขาดเรียน</label>
      <input type="checkbox" id="chk-sick" value="sick" checked> <label>ป่วย</label>
      <input type="checkbox" id="chk-leave" value="leave"> <label>ลากิจ</label>
      <input type="checkbox" id="chk-late" value="late"> <label>มาสาย</label>
    </div>

    <div class="form-group">
      <label><b>✍️ ผู้เซ็นรับรอง (ครูประจำชั้น):</b></label>
      <select id="selectTeacher">
        <option value="ว่าที่ร้อยเอกอัษฎเดช จารุโสภณ">ว่าที่ร้อยเอกอัษฎเดช จารุโสภณ</option>
        <option value="ครูแตงโม">ครูแตงโม</option>
      </select>
    </div>

    <button onclick="generateReport()">1. กดดูตัวอย่างรายงาน</button>
    <button onclick="exportToPDF()" style="background-color: #e74c3c;">2. 📄 ดาวน์โหลดเป็น PDF</button>
  </div>

  <!-- 📄 ส่วนที่จะถูกแคปเจอร์เป็นไฟล์ PDF (A4) -->
  <div id="pdf-content">
    <h2>รายงานสรุปการเข้าเรียน (เฉพาะผู้ขาด/ลา/มาสาย)</h2>
    <h3>โรงเรียนวัดชัยมงคล</h3>
    <h4 style="text-align: center;" id="report-month-title">ประจำเดือน: -</h4>
    
    <table>
      <thead>
        <tr>
          <th width="20%">วันที่</th>
          <th width="15%">เลขที่</th>
          <th width="45%">ชื่อ - นามสกุล</th>
          <th width="20%">สถานะ</th>
        </tr>
      </thead>
      <tbody id="report-table-body">
        <!-- ข้อมูลนักเรียนจะถูกเติมลงที่นี่ด้วย JavaScript -->
      </tbody>
    </table>

    <div class="signature-box">
      <p>ลงชื่อ......................................................ผู้รายงาน</p>
      <p>( <span id="display-teacher-name"></span> )</p>
      <p>ตำแหน่ง ครูประจำชั้น</p>
    </div>
  </div>

  <script>
    // 🟢 ฟังก์ชัน 1: ดึงข้อมูลและสร้างตารางตัวอย่าง (จำลองข้อมูล Firebase)
    function generateReport() {
      // 1. ดึงค่าจากหน้าจอ
      const selectedMonthText = document.getElementById('selectMonth').options[document.getElementById('selectMonth').selectedIndex].text;
      const selectedTeacher = document.getElementById('selectTeacher').value;
      
      // เช็คว่าติ๊กสถานะไหนบ้าง
      const filters = [];
      if(document.getElementById('chk-absent').checked) filters.push('absent');
      if(document.getElementById('chk-sick').checked) filters.push('sick');
      if(document.getElementById('chk-leave').checked) filters.push('leave');
      if(document.getElementById('chk-late').checked) filters.push('late');

      // 2. อัปเดตข้อความในกระดาษ PDF
      document.getElementById('report-month-title').innerText = "ประจำเดือน: " + selectedMonthText;
      document.getElementById('display-teacher-name').innerText = selectedTeacher;

      // 3. จำลองข้อมูล (ตรงนี้ครูต้องเชื่อมกับโค้ดดึงข้อมูลจาก Firebase ของจริง)
      const mockData = [
        { date: '1 ส.ค. 2569', id: '5', name: 'เด็กชายสมชาย ใจดี', status: 'absent' },
        { date: '1 ส.ค. 2569', id: '12', name: 'เด็กหญิงสมหญิง รักเรียน', status: 'sick' },
        { date: '2 ส.ค. 2569', id: '5', name: 'เด็กชายสมชาย ใจดี', status: 'leave' }
      ];

      // 4. กรองและวาดตาราง
      let tableHTML = "";
      mockData.forEach(row => {
        // กรองเฉพาะสถานะที่ครูติ๊กเลือก
        if(filters.includes(row.status)) {
          let statusTh = row.status === 'absent' ? 'ขาด' : (row.status === 'sick' ? 'ป่วย' : (row.status === 'leave' ? 'ลากิจ' : 'มาสาย'));
          tableHTML += `<tr>
                          <td>${row.date}</td>
                          <td>${row.id}</td>
                          <td style="text-align: left;">${row.name}</td>
                          <td>${statusTh}</td>
                        </tr>`;
        }
      });

      if(tableHTML === "") {
        tableHTML = "<tr><td colspan='4'>ไม่มีข้อมูลตามเงื่อนไขที่เลือก</td></tr>";
      }

      document.getElementById('report-table-body').innerHTML = tableHTML;
      
      // แสดงหน้ากระดาษจำลอง
      document.getElementById('pdf-content').style.display = 'block';
    }

    // 🟢 ฟังก์ชัน 2: ส่งออกเป็น PDF
    function exportToPDF() {
      // ต้องกดปุ่มสร้างตัวอย่างก่อนถึงจะเซฟได้
      if(document.getElementById('pdf-content').style.display === 'none') {
        alert("กรุณากด 'ดูตัวอย่างรายงาน' ก่อนดาวน์โหลดครับ");
        return;
      }

      const element = document.getElementById('pdf-content');
      const opt = {
        margin:       0,
        filename:     'สรุปเวลาเรียน_ม2.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 }, // ความละเอียดชัดเจน
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' } // กระดาษ A4 แนวตั้ง
      };

      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
